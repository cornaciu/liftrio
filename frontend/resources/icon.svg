<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#CCFF00"/>

  <!-- Spoon: the handle continues into one end of the crossed weight set. -->
  <path fill="#080808" d="M68 68c25-25 68-10 91 15 22 24 20 52 0 72-20 20-49 16-70-5-24-24-39-60-21-82Z"/>
  <path fill="#080808" d="m145 136 20-20 211 211c9 9 9 19 1 27-8 8-18 8-27-1L145 136Z"/>

  <!-- Fork: its four prongs and tapered stem form one continuous silhouette. -->
  <g transform="translate(342 154) rotate(45)" fill="#080808">
    <rect x="-29" y="-125" width="10" height="116" rx="5"/>
    <rect x="-10" y="-135" width="10" height="126" rx="5"/>
    <rect x="10" y="-135" width="10" height="126" rx="5"/>
    <rect x="29" y="-125" width="10" height="116" rx="5"/>
    <path d="M-35-19v11c0 17 12 30 28 32v267q7 10 14 0V24c16-2 28-15 28-32v-11H23v10c0 7-5 12-12 14V-19H-9V5c-7-2-12-7-12-14v-10Z"/>
  </g>

  <!-- Compact plate stacks at the ends make both handles read as dumbbells. -->
