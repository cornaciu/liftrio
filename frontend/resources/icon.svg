    <g transform="translate(145 355) rotate(45)">
      <rect x="-24" y="-28" width="48" height="14" rx="7"/>
      <rect x="-32" y="-9" width="64" height="18" rx="8"/>
      <rect x="-24" y="14" width="48" height="14" rx="7"/>
    </g>
    <g transform="translate(382 381) rotate(-45)">
      <rect x="-24" y="-28" width="48" height="14" rx="7"/>
      <rect x="-32" y="-9" width="64" height="18" rx="8"/>
      <rect x="-24" y="14" width="48" height="14" rx="7"/>
    </g>
  </g>
</svg>
